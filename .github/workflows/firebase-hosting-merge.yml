# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
"on":
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm ci && npm run build
        env:
          NUXT_MONGODB_URI: "${{secrets.NUXT_MONGODB_URI}}"
          NUXT_MONGODB_URI_DEV: "${{secrets.NUXT_MONGODB_URI_DEV}}"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_API3_ECOSYSTEM }}"
          channelId: live
          projectId: api3-ecosystem
